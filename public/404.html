<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:;"
    />
    <script>
      // Single Page Application redirect for GitHub Pages
      // Direct URLs like /register or /about are rewritten to /#/register or /#/about
      var path = window.location.pathname.replace(/^\/+/, '');
      if (path) {
        var query = window.location.search || '';
        var hash = window.location.hash || '';
        window.location.replace('/#/' + path + query + hash);
      }
    </script>
    <title>Page Not Found - FoxDenCon</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background-color: #0f172a;
        color: #f8fafc;
        text-align: center;
        padding: 1.5rem;
      }
      h1 {
        font-size: 3.5rem;
        margin: 0 0 0.5rem 0;
        color: #60a5fa;
      }
      p {
        font-size: 1.25rem;
        color: #94a3b8;
        margin: 0 0 2rem 0;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.75rem;
        background-color: #2563eb;
        color: #ffffff;
        text-decoration: none;
        border-radius: 0.5rem;
        font-weight: 600;
        transition: background-color 0.2s;
      }
      a:hover {
        background-color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>Sorry, the page you are looking for could not be found.</p>
    <a href="/">Return to Home</a>
  </body>
</html>
